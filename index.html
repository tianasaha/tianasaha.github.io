<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Portfolio 2026–27</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="pdf-container" aria-label="Portfolio PDF"></div>
    <div id="loading" class="loading">Loading portfolio…</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      var container = document.getElementById("pdf-container");
      var loadingEl = document.getElementById("loading");
      var pdfDoc = null;
      var pageList = [];
      var renderInProgress = false;
      var pendingRerender = false;
      var debounceMs = 400;

      function getZoomScale() {
        if (
          window.visualViewport &&
          typeof window.visualViewport.scale === "number"
        ) {
          return Math.max(1, window.visualViewport.scale);
        }
        return 1;
      }

      function renderPageToCanvas(pdf, pageNum, canvas) {
        return pdf.getPage(pageNum).then(function (page) {
          var w = container.clientWidth || window.innerWidth;
          if (w < 1) w = window.innerWidth;
          var viewport = page.getViewport({ scale: 1 });
          var displayScale = w / viewport.width;
          var zoomScale = getZoomScale();
          var pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
          var renderScale = displayScale * zoomScale * pixelRatio;
          var scaledViewport = page.getViewport({ scale: renderScale });
          var displayW = viewport.width * displayScale;
          var displayH = viewport.height * displayScale;

          var off = document.createElement("canvas");
          off.width = Math.floor(scaledViewport.width);
          off.height = Math.floor(scaledViewport.height);
          var ctx = off.getContext("2d");
          var renderContext = {
            canvasContext: ctx,
            viewport: scaledViewport,
            enableWebGL: false,
            renderInteractiveForms: false,
          };
          return page.render(renderContext).promise.then(function () {
            canvas.width = off.width;
            canvas.height = off.height;
            canvas.style.width = displayW + "px";
            canvas.style.height = displayH + "px";
            canvas.getContext("2d").drawImage(off, 0, 0);
            canvas.setAttribute("aria-label", "Page " + pageNum);
          });
        });
      }

      function renderAllPages() {
        if (!pdfDoc || renderInProgress) {
          if (pdfDoc) pendingRerender = true;
          return Promise.resolve();
        }
        renderInProgress = true;
        pendingRerender = false;
        var chain = Promise.resolve();
        pageList.forEach(function (item) {
          chain = chain.then(function () {
            return renderPageToCanvas(pdfDoc, item.pageNum, item.canvas);
          });
        });
        return chain.then(
          function () {
            renderInProgress = false;
            if (pendingRerender) {
              pendingRerender = false;
              renderAllPages();
            }
          },
          function () {
            renderInProgress = false;
            if (pendingRerender) {
              pendingRerender = false;
              renderAllPages();
            }
          },
        );
      }

      function loadPdf() {
        pdfjsLib
          .getDocument("portfolio26-27.pdf")
          .promise.then(function (pdf) {
            pdfDoc = pdf;
            loadingEl.classList.add("loaded");
            var chain = Promise.resolve();
            for (var i = 1; i <= pdf.numPages; i++) {
              (function (n) {
                var canvas = document.createElement("canvas");
                canvas.setAttribute("data-page", String(n));
                pageList.push({ canvas: canvas, pageNum: n });
                chain = chain
                  .then(function () {
                    return renderPageToCanvas(pdf, n, canvas);
                  })
                  .then(function () {
                    container.appendChild(canvas);
                  });
              })(i);
            }
            return chain;
          })
          .then(function () {
            var debounceTimer = null;
            function schedule() {
              if (debounceTimer) clearTimeout(debounceTimer);
              debounceTimer = setTimeout(function () {
                debounceTimer = null;
                renderAllPages();
              }, debounceMs);
            }
            if (window.visualViewport) {
              window.visualViewport.addEventListener("resize", schedule);
              window.visualViewport.addEventListener("scroll", schedule);
            }
            window.addEventListener("resize", schedule);
          })
          .catch(function () {
            loadingEl.innerHTML =
              'Unable to load PDF. <a href="portfolio26-27.pdf" target="_blank" rel="noopener">Open PDF</a>';
            loadingEl.classList.add("loaded");
          });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", loadPdf);
      } else {
        loadPdf();
      }
    </script>
  </body>
</html>
