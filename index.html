<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Portfolio 2026–27</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="pdf-container" aria-label="Portfolio PDF"></div>
    <div id="loading" class="loading">Loading portfolio…</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      var container = document.getElementById("pdf-container");
      var loading = document.getElementById("loading");
      var pdfDoc = null;
      var pageCanvases = [];

      function getZoomScale() {
        if (
          window.visualViewport &&
          typeof window.visualViewport.scale === "number"
        ) {
          return Math.max(1, window.visualViewport.scale);
        }
        return 1;
      }

      function renderPageToCanvas(pdf, pageNum, canvas) {
        return pdf.getPage(pageNum).then(function (page) {
          var containerWidth = container.clientWidth;
          var viewport = page.getViewport({ scale: 1 });
          var displayScale = containerWidth / viewport.width;
          var zoomScale = getZoomScale();
          var pixelRatio = window.devicePixelRatio || 1;
          var renderScale = displayScale * zoomScale * pixelRatio;
          var scaledViewport = page.getViewport({ scale: renderScale });

          canvas.width = Math.floor(scaledViewport.width);
          canvas.height = Math.floor(scaledViewport.height);
          canvas.style.width = viewport.width * displayScale + "px";
          canvas.style.height = viewport.height * displayScale + "px";
          canvas.setAttribute("role", "img");
          canvas.setAttribute(
            "aria-label",
            "Page " + pageNum + " of portfolio",
          );

          var renderContext = {
            canvasContext: canvas.getContext("2d"),
            viewport: scaledViewport,
            enableWebGL: false,
            renderInteractiveForms: false,
          };
          return page.render(renderContext).promise;
        });
      }

      function renderAllPages() {
        if (!pdfDoc) return;
        var zoomScale = getZoomScale();
        var chain = Promise.resolve();
        pageCanvases.forEach(function (item) {
          chain = chain.then(function () {
            return renderPageToCanvas(pdfDoc, item.pageNum, item.canvas);
          });
        });
        return chain;
      }

      function loadPdf() {
        pdfjsLib
          .getDocument("portfolio26-27.pdf")
          .promise.then(function (pdf) {
            pdfDoc = pdf;
            loading.classList.add("loaded");
            var numPages = pdf.numPages;
            var chain = Promise.resolve();
            for (var i = 1; i <= numPages; i++) {
              (function (pageNum) {
                var canvas = document.createElement("canvas");
                canvas.setAttribute("data-page", String(pageNum));
                pageCanvases.push({ canvas: canvas, pageNum: pageNum });
                chain = chain
                  .then(function () {
                    return renderPageToCanvas(pdf, pageNum, canvas);
                  })
                  .then(function () {
                    container.appendChild(canvas);
                  });
              })(i);
            }
            return chain;
          })
          .then(function () {
            var debounceTimer = null;
            function scheduleRerender() {
              if (debounceTimer) clearTimeout(debounceTimer);
              debounceTimer = setTimeout(function () {
                debounceTimer = null;
                renderAllPages();
              }, 120);
            }
            if (window.visualViewport) {
              window.visualViewport.addEventListener(
                "resize",
                scheduleRerender,
              );
              window.visualViewport.addEventListener(
                "scroll",
                scheduleRerender,
              );
            }
            window.addEventListener("resize", scheduleRerender);
          })
          .catch(function (err) {
            loading.textContent = "Unable to load PDF. ";
            var a = document.createElement("a");
            a.href = "portfolio26-27.pdf";
            a.textContent = "Open PDF instead.";
            a.setAttribute("target", "_blank");
            loading.appendChild(a);
            loading.classList.add("loaded");
          });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", loadPdf);
      } else {
        loadPdf();
      }
    </script>
  </body>
</html>
